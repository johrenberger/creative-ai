name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov-report/
          retention-days: 30

  pages:
    name: Deploy Coverage to GitHub Pages
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate coverage report
        run: npm test

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload coverage artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage/lcov-report/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for secrets
        run: |
          if command -v gitleaks &> /dev/null; then
            gitleaks detect --source . --verbose
          else
            echo "Gitleaks not installed, skipping secret scan"
          fi
        continue-on-error: true

  build-and-e2e:
    name: Build Application & E2E Tests in Docker
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify build output
        run: |
          echo "Checking for required files..."
          test -f package.json && echo "✓ package.json"
          test -f src/server.js && echo "✓ src/server.js"
          test -f src/cli.js && echo "✓ src/cli.js"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build Docker image (local only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cti-e2e:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d \
            --name cti-e2e \
            -p 3456:3456 \
            -e CTI_DB_PATH=/tmp/cti.db \
            -e CTI_WEBHOOK_SECRET=test-secret \
            -e CTI_START_SERVER=true \
            cti-e2e:latest

      - name: Debug container startup
        run: |
          echo "=== Container status ==="
          sleep 2
          docker ps -a
          echo ""
          echo "=== Container logs ==="
          docker logs cti-e2e 2>&1
          echo ""
          echo "=== Port check ==="
          docker exec cti-e2e sh -c "netstat -tlnp 2>/dev/null || ss -tlnp 2>/dev/null || cat /proc/net/tcp 2>/dev/null" || true
          echo ""
          echo "=== Process check ==="
          docker exec cti-e2e ps aux 2>&1 || true
          echo ""
          echo "=== Direct health test from inside container ==="
          docker exec cti-e2e sh -c "node -e \"fetch('http://127.0.0.1:3456/health').then(r=>console.log('status:', r.status)).catch(e=>console.error('error:', e.message))\"" 2>&1 || true

      - name: Wait for container to be ready
        run: |
          sleep 5
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:3456/health > /dev/null 2>&1; then
              echo "Container is ready"
              exit 0
            fi
            echo "Waiting for container... ($i/60)"
            sleep 1
          done
          echo "Container failed to start"
          docker logs cti-e2e
          exit 1

      - name: Validate health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3456/health)
          if [ "$STATUS" = "200" ]; then
            echo "✓ Health check: $STATUS"
          else
            echo "✗ Health check: $STATUS (expected 200)"
            exit 1
          fi

      - name: Validate stats endpoint
        run: |
          BODY=$(curl -s http://localhost:3456/api/stats)
          echo "$BODY" | grep -q "tasks" && echo "✓ /api/stats returns tasks"
          echo "$BODY" | grep -q "memories" && echo "✓ /api/stats returns memories"
          echo "$BODY" | grep -q "exchanges" && echo "✓ /api/stats returns exchanges"

      - name: Validate all API endpoints
        run: |
          FAILED=0

          echo "=== /api/tasks (requires auth - expect 401) ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3456/api/tasks)
          echo "Response code: $STATUS"
          if [ "$STATUS" = "401" ]; then
            echo "✓ /api/tasks requires authentication (401)"
          else
            echo "✗ /api/tasks: expected 401, got $STATUS"
            FAILED=1
          fi

          echo ""
          echo "=== /api/context (requires auth - expect 401) ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3456/api/context)
          echo "Response code: $STATUS"
          if [ "$STATUS" = "401" ]; then
            echo "✓ /api/context requires authentication (401)"
          else
            echo "✗ /api/context: expected 401, got $STATUS"
            FAILED=1
          fi

          echo ""
          echo "=== /api/memory/recent (requires auth - expect 401) ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3456/api/memory/recent)
          echo "Response code: $STATUS"
          if [ "$STATUS" = "401" ]; then
            echo "✓ /api/memory/recent requires authentication (401)"
          else
            echo "✗ /api/memory/recent: expected 401, got $STATUS"
            FAILED=1
          fi

          echo ""
          echo "=== /api/bridge/exchange (requires auth - expect 401) ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3456/api/bridge/exchange)
          echo "Response code: $STATUS"
          if [ "$STATUS" = "401" ]; then
            echo "✓ /api/bridge/exchange requires authentication (401)"
          else
            echo "✗ /api/bridge/exchange: expected 401, got $STATUS"
            FAILED=1
          fi

          echo ""
          echo "=== /api/stats (public - expect 200) ==="
          RESP=$(curl -s http://localhost:3456/api/stats)
          echo "$RESP"
          echo "$RESP" | grep -q "tasks" && echo "✓ /api/stats returns tasks" || { echo "✗ /api/stats FAILED"; FAILED=1; }

          echo ""
          echo "=== POST /api/auth/register ==="
          REG_RESP=$(curl -s -w "\n%{http_code}" -X POST http://localhost:3456/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"ciuser","email":"ci@test.com","password":"testpassword123"}')
          REG_CODE=$(echo "$REG_RESP" | tail -1)
          echo "Response code: $REG_CODE"
          if [ "$REG_CODE" = "201" ]; then
            echo "✓ /api/auth/register creates user (201)"
          else
            echo "✗ /api/auth/register: expected 201, got $REG_CODE"
            FAILED=1
          fi

          echo ""
          echo "=== POST /api/auth/login ==="
          LOGIN_RESP=$(curl -s -w "\n%{http_code}" -X POST http://localhost:3456/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"ciuser","password":"testpassword123"}')
          LOGIN_CODE=$(echo "$LOGIN_RESP" | tail -1)
          LOGIN_BODY=$(echo "$LOGIN_RESP" | head -1)
          echo "Response code: $LOGIN_CODE"
          if [ "$LOGIN_CODE" = "200" ]; then
            echo "✓ /api/auth/login succeeds (200)"
            SESSION_COOKIE=$(echo "$LOGIN_RESP" | grep -i "set-cookie" | head -1)
            echo "Session cookie: ${SESSION_COOKIE:0:50}..."
          else
            echo "✗ /api/auth/login: expected 200, got $LOGIN_CODE"
            FAILED=1
          fi

          echo ""
          echo "=== POST /api/auth/login (wrong password - expect 401) ==="
          BAD_LOGIN=$(curl -s -w "\n%{http_code}" -X POST http://localhost:3456/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"ciuser","password":"wrongpassword"}')
          BAD_CODE=$(echo "$BAD_LOGIN" | tail -1)
          echo "Response code: $BAD_CODE"
          if [ "$BAD_CODE" = "401" ]; then
            echo "✓ /api/auth/login with wrong password returns 401"
          else
            echo "✗ /api/auth/login with wrong password: expected 401, got $BAD_CODE"
            FAILED=1
          fi

          echo ""
          echo "=== GET /api/auth/session (no cookie - expect unauthenticated) ==="
          SESS_RESP=$(curl -s http://localhost:3456/api/auth/session)
          echo "$SESS_RESP"
          echo "$SESS_RESP" | grep -q "authenticated.*false" && echo "✓ /api/auth/session returns unauthenticated" || { echo "✗ /api/auth/session FAILED"; FAILED=1; }

          echo ""
          echo "Auth endpoint validation complete"
          if [ $FAILED -eq 1 ]; then
            echo "⚠ Some auth validation checks failed — see above"
            exit 1
          fi

      - name: Validate 404 for unknown routes
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3456/api/nonexistent)
          if [ "$STATUS" = "404" ]; then
            echo "✓ 404 handling: $STATUS"
          else
            echo "✗ 404 handling: $STATUS (expected 404)"
            exit 1
          fi

      - name: Validate security headers
        run: |
          HEADERS=$(curl -sI http://localhost:3456/health)
          echo "$HEADERS" | grep -qi "x-frame-options" && echo "✓ X-Frame-Options present"
          echo "$HEADERS" | grep -qi "x-content-type-options" && echo "✓ X-Content-Type-Options present"
          echo "$HEADERS" | grep -qi "strict-transport" && echo "✓ HSTS present"

      - name: Cleanup container
        if: always()
        run: |
          docker stop cti-e2e || true
          docker rm cti-e2e || true

  docker:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image: ghcr.io/${{ github.repository }}/cti:${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/cti:${{ github.sha }}
            ghcr.io/${{ github.actor }}/cti:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: [build-and-e2e, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy to Hostinger VPS
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: creative-ai
          docker-compose-path: docker-compose.yml
          environment-variables: |
            CTI_PORT=3456
            CTI_WEBHOOK_SECRET=${{ secrets.CTI_WEBHOOK_SECRET }}

  e2e-ui-tests:
    name: UI Tests (Headless Playwright)
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --break-system-packages \
            pytest \
            playwright \
            pytest-playwright \
            pytest-base-url

      - name: Install Chromium browser
        run: playwright install chromium

      - name: Register test user (if not exists)
        run: |
          python3 -c "
          import urllib.request, json
          url = 'https://cti.clawdexter.tech/api/auth/register'
          data = json.dumps({'username':'e2etest','email':'e2e@test.com','password':'testpass123'}).encode()
          req = urllib.request.Request(url, data=data, headers={'Content-Type':'application/json'})
          try:
            with urllib.request.urlopen(req) as r:
              print('Test user registered:', r.status)
          except urllib.error.HTTPError as e:
            if e.code == 409:
              print('Test user already exists, skipping')
            else:
              print('Unexpected error:', e.code)
              raise
          "

      - name: Run E2E UI tests
        run: |
          pytest tests/e2e/test_cti.py \
            --base-url=https://cti.clawdexter.tech \
            -v \
            --tb=short \
            -m "not websocket"
        continue-on-error: true

      - name: Run WebSocket tests
        run: |
          pytest tests/e2e/test_cti.py \
            --base-url=https://cti.clawdexter.tech \
            -v \
            --tb=short \
            -m websocket
        continue-on-error: true

      - name: Upload Playwright traces (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: playwright-traces/
          retention-days: 14